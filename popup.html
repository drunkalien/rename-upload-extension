<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    width: 280px; margin: 0; padding: 14px; font-size: 13px;
    background: #fff; color: #222;
  }
  h1 { font-size: 14px; margin: 0 0 12px; }
  h2 { font-size: 12px; margin: 16px 0 6px; color: #555; text-transform: uppercase; letter-spacing: 0.03em; }
  .toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  button {
    padding: 5px 10px; font-size: 12px; border-radius: 6px;
    border: 1px solid #ccc; background: #f5f5f5; color: #222; cursor: pointer;
  }
  button:hover { background: #ebebeb; }
  #excludeCurrent { width: 100%; margin-bottom: 8px; }
  .addRow { display: flex; gap: 6px; }
  .addRow input {
    flex: 1; min-width: 0; padding: 5px 8px; font-size: 12px;
    border: 1px solid #ccc; border-radius: 6px;
    background: #fff; color: #222;
  }
  ul { list-style: none; margin: 8px 0 0; padding: 0; }
  li {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 0; border-bottom: 1px solid #eee; font-size: 12px;
  }
  li button { padding: 1px 7px; font-size: 11px; }
  .empty { color: #999; font-size: 12px; margin: 8px 0 0; }
  #clearHistory { width: 100%; margin-top: 6px; }
  #status { color: #16a34a; font-size: 12px; min-height: 16px; margin-top: 6px; text-align: center; }
</style>
</head>
<body>
  <h1>File Upload Renamer</h1>

  <label class="toggle">
    <input type="checkbox" id="enabled">
    Ask to rename on file upload
  </label>

  <h2>Excluded websites</h2>
  <button id="excludeCurrent">Exclude current site</button>
  <div class="addRow">
    <input type="text" id="siteInput" placeholder="example.com">
    <button id="addSite">Add</button>
  </div>
  <ul id="siteList"></ul>
  <p class="empty" id="emptyNote">No excluded sites.</p>

  <h2>Suggestions</h2>
  <button id="clearHistory">Clear rename history</button>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
