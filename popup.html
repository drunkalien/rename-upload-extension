<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      font-family: system-ui, sans-serif;
      width: 260px;
      padding: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      color: #555;
      margin-bottom: 4px;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    button {
      width: 100%;
      padding: 8px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    #status {
      font-size: 11px;
      color: #16a34a;
      margin-top: 6px;
      min-height: 14px;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <label for="filename">New filename (include extension)</label>
  <input id="filename" type="text" placeholder="e.g. My_Resume.pdf" />

  <div class="toggle-row">
    <input id="enabled" type="checkbox" style="width:auto;" />
    <label for="enabled" style="margin:0;">Enabled</label>
  </div>

  <button id="save">Save</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
